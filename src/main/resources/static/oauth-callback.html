<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로그인 처리 중...</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }
        .loading {
            text-align: center;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loading">
        <div class="spinner"></div>
        <p>로그인 처리 중입니다...</p>
    </div>

    <script>
        // URL에서 토큰 추출 (쿼리 파라미터 또는 해시)
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (token) {
            // 부모 창으로 토큰 전달
            if (window.opener) {
                window.opener.postMessage({ accessToken: token }, '*');
                window.close();
            } else {
                // 팝업이 아닌 경우 직접 저장하고 메인 페이지로 이동
                localStorage.setItem('accessToken', token);
                window.location.href = '/login-test.html';
            }
        } else {
            alert('로그인에 실패했습니다.');
            if (window.opener) {
                window.close();
            } else {
                window.location.href = '/login-test.html';
            }
        }
    </script>
</body>
</html>
